<article class="news-card">
  {{ with .Params.hero_image }}
  <a class="news-card__image-link" href="{{ $.RelPermalink }}" tabindex="-1" aria-hidden="true">
    <img class="news-card__image" src="/images/{{ . }}" alt="{{ $.Title }}" loading="lazy">
  </a>
  {{ end }}
  <div class="news-card__body">
    <time class="news-card__date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    <h3 class="news-card__title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="news-card__summary">{{ .Params.summary }}</p>
    <a class="news-card__link" href="{{ .RelPermalink }}">Read more →</a>
  </div>
</article>
