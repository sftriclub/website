{{ $src := .Get "src" }}
{{ $alt := .Get "alt" | default "" }}
{{ $side := .Get "side" | default "right" }}
<div class="image-section image-section--{{ $side }}">
  <div class="image-section__content">{{ .Inner | markdownify }}</div>
  <div class="image-section__image">
    {{ partial "image.html" (dict "src" $src "alt" $alt "sizes" "(max-width: 700px) 100vw, 50vw") }}
  </div>
</div>
