{{ define "main" }}
<div class="contact-page">
  <div class="contact-page__header container">
    <h1 class="page-title">{{ .Title }}</h1>
  </div>
  <div class="contact-page__body container">
    <div class="contact-page__info">
      <p>Email us directly at <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a></p>
      <nav class="contact-social" aria-label="Social links">
        <a href="{{ .Site.Params.instagram }}" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="{{ .Site.Params.facebook }}" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a href="{{ .Site.Params.tiktok }}" target="_blank" rel="noopener noreferrer">TikTok</a>
        <a href="{{ .Site.Params.strava }}" target="_blank" rel="noopener noreferrer">Strava</a>
      </nav>
    </div>
    <form class="contact-form" id="contact-form" novalidate>
      <div class="form-field">
        <label class="form-label" for="contact-name">Name <span aria-hidden="true">*</span></label>
        <input class="form-input" type="text" id="contact-name" name="name" required autocomplete="name">
      </div>
      <div class="form-field">
        <label class="form-label" for="contact-email">Email <span aria-hidden="true">*</span></label>
        <input class="form-input" type="email" id="contact-email" name="email" required autocomplete="email">
      </div>
      <div class="form-field">
        <label class="form-label" for="contact-message">Message <span aria-hidden="true">*</span></label>
        <textarea class="form-input form-textarea" id="contact-message" name="message" required rows="6"></textarea>
      </div>
      <button class="btn btn--primary" type="submit">Send</button>
      <p class="form-status" id="form-status" aria-live="polite"></p>
    </form>
  </div>
</div>
{{ end }}
