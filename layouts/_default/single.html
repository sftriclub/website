{{ define "main" }}
<article class="page">
  {{ with .Params.hero_image }}
  <div class="page-hero">
    <img class="hero-bg-image" src="{{ . }}" alt="{{ $.Params.hero_image_alt | default "" }}"
         style="object-position: {{ $.Params.hero_position | default "center" }}" fetchpriority="high">
    <div class="page-hero__overlay"></div>
    <div class="page-hero__content container">
      <h1 class="page-hero__title">{{ $.Title }}</h1>
      {{ with $.Params.subtitle }}<p class="page-hero__subtitle">{{ . }}</p>{{ end }}
    </div>
  </div>
  {{ else }}
  <div class="page-header container">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="page-subtitle">{{ . }}</p>{{ end }}
  </div>
  {{ end }}

  <div class="page-body container">
    {{ .Content }}
  </div>

  {{ partial "cta-block.html" . }}
</article>
{{ end }}
