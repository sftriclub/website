          - { name: card_text, label: Card Text, widget: text, required: false, hint: "Short blurb on this sport's card on the homepage and Sports page. Falls back to the SEO Description." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the sport cards on the homepage and the Sports page." }
