backend:
  name: github
  repo: sftriclub/website
  branch: main
  base_url: https://sveltia-cms-auth.sf-tri-club.workers.dev

# Local editing: run `mise run dev` (alias `mise run cms`), open
# http://localhost:1313/admin/ in a Chromium browser and click "Work with Local
# Repository". Sveltia edits the files directly through the File System Access
# API; it needs no proxy server and ignores local_backend, which is kept only
# for Decap compatibility.
local_backend: true

# Fallback for anything without its own media folder. Each collection below sets a
# `media_folder` so uploads land in the right subfolder of static/images/ instead of
# piling up at the top level. Collection- and field-level paths must be absolute
# (leading slash = repository root); `public_folder` is the matching site URL path.
media_folder: static/images
public_folder: /images

collections:

  # ── Top-level pages ──────────────────────────────────────────────────────
  - name: pages
    label: Pages
    media_folder: /static/images/pages
    public_folder: /images/pages
    files:
      - name: homepage
        label: Homepage
        file: content/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: hero_headline, label: Hero Headline, widget: string }
          - { name: hero_subheadline, label: Hero Subheadline, widget: string }
          - { name: hero_cta_text, label: CTA Button Text, widget: string }
          - { name: hero_cta_url, label: CTA Button URL, widget: string }
          - { name: hero_image, label: Hero Image, widget: image }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }

      - name: trial_workout
        label: Trial Workout
        file: content/trial-workout.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: layout, widget: hidden, default: trial-workout }
          - { name: no_cta, label: Hide the footer call-to-action, widget: boolean, required: false, default: true }
          - { name: cta_secondary_text, label: Secondary CTA Text, widget: string, required: false }
          - name: details
            label: Workout Details
            label_singular: Detail
            widget: list
            hint: "The When / Where / Who facts shown at the top of the page."
            fields:
              - { name: label, label: Label, widget: string, hint: "e.g. When, Where, Who" }
              - { name: value, label: Value, widget: string }
              - { name: note, label: Note, widget: string, required: false }
              - { name: link_text, label: Link Text, widget: string, required: false }
              - { name: link, label: Link URL, widget: string, required: false }
          - name: steps
            label: Steps
            label_singular: Step
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text, required: false, hint: "Markdown links allowed, e.g. [text](https://...)" }
          - { name: body, label: Body, widget: markdown }

      - name: membership
        label: Membership
        file: content/membership.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: layout, widget: hidden, default: membership }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: no_cta, label: Hide the footer call-to-action, widget: boolean, required: false, default: true }
          - { name: week_heading, label: Weekly Schedule Heading, widget: string, required: false }
          - name: week
            label: Weekly Schedule
            label_singular: Day
            widget: list
            fields:
              - { name: day, label: Day, widget: string, hint: "Short label, e.g. Tue" }
              - name: items
                label: Workouts
                label_singular: Workout
                widget: list
                fields:
                  - { name: sport, label: Sport, widget: select, options: [swim, bike, run], hint: "Sets the colour and tag." }
                  - { name: title, label: Title, widget: string }
                  - { name: when, label: When, widget: string, hint: "e.g. Morning, Evening" }
                  - { name: detail, label: Detail, widget: string, required: false, hint: "e.g. With Coach JD" }
          - { name: programs_heading, label: Programs Heading, widget: string, required: false }
          - name: programs
            label: Programs
            label_singular: Program
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text, hint: "Markdown links allowed." }
              - { name: url, label: Learn More Link, widget: string, required: false }
          - { name: perks_heading, label: Perks Heading, widget: string, required: false }
          - name: perks
            label: Perks
            label_singular: Perk
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text, hint: "Markdown links allowed." }
              - { name: show_sponsors, label: Show sponsor logos, widget: boolean, required: false, default: false }
              - { name: url, label: Learn More Link, widget: string, required: false }
          - { name: price, label: Price, widget: string, required: false, hint: "e.g. $145 per year" }
          - { name: price_note, label: Price Note, widget: string, required: false }
          - { name: closing_heading, label: Closing Heading, widget: string, required: false }
          - { name: closing_image, label: Closing Photo, widget: image, required: false, media_folder: /static/images/social, public_folder: /images/social }
          - { name: closing_image_alt, label: Closing Photo Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: join_text, label: Join Button Text, widget: string, required: false, default: "Join on Heylo" }
          - { name: join_url, label: Join Button Link, widget: string, required: false, hint: "Leave blank to use the club's Heylo invite link (heyloSignup in hugo.toml)." }

      - name: contact
        label: Contact
        file: content/contact.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text, required: false, hint: "Used in Google results and link previews when SEO Description is empty." }
          - { name: meta_description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews instead of the description above. Aim for 120-155 characters." }

  # ── Training Programs ─────────────────────────────────────────────────────
  - name: training
    label: Training Programs
    media_folder: /static/images/training
    public_folder: /images/training
    files:

      - name: training_index
        label: "Training Landing Page"
        file: content/training/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: body, label: Intro Text, widget: markdown, required: false, hint: "Short intro shown above the cards on this landing page." }
      - name: zero_to_sixty
        label: Zero to Sixty
        file: content/training/zero-to-sixty.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Also used on the program cards when Card Text is empty. Aim for 120-160 characters." }
          - { name: card_text, label: Card Text, widget: text, required: false, hint: "Short blurb on this program's card on the homepage and Training page." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the program cards on the homepage and the Training page." }
          - { name: body, label: Body, widget: markdown }

      - name: half_ironman
        label: Half Ironman
        file: content/training/half-ironman.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Also used on the program cards when Card Text is empty. Aim for 120-160 characters." }
          - { name: card_text, label: Card Text, widget: text, required: false, hint: "Short blurb on this program's card on the homepage and Training page." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the program cards on the homepage and the Training page." }
          - { name: body, label: Body, widget: markdown }

      - name: ironman
        label: Ironman
        file: content/training/ironman.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Also used on the program cards when Card Text is empty. Aim for 120-160 characters." }
          - { name: card_text, label: Card Text, widget: text, required: false, hint: "Short blurb on this program's card on the homepage and Training page." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the program cards on the homepage and the Training page." }
          - { name: body, label: Body, widget: markdown }

      - name: training_weekend
        label: Training Weekend
        file: content/training/training-weekend.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Also used on the program cards when Card Text is empty. Aim for 120-160 characters." }
          - { name: card_text, label: Card Text, widget: text, required: false, hint: "Short blurb on this program's card on the homepage and Training page." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the program cards on the homepage and the Training page." }
          - { name: body, label: Body, widget: markdown }

      - name: coaching
        label: Coaching
        file: content/training/coaching.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Also used on the program cards when Card Text is empty. Aim for 120-160 characters." }
          - { name: card_text, label: Card Text, widget: text, required: false, hint: "Short blurb on this program's card on the homepage and Training page." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the program cards on the homepage and the Training page." }
          - { name: body, label: Body, widget: markdown }

  # ── Sports ────────────────────────────────────────────────────────────────
  - name: sports
    label: Sports
    media_folder: /static/images/sports
    public_folder: /images/sports
    files:

      - name: sports_index
        label: "Sports Landing Page"
        file: content/sports/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: body, label: Intro Text, widget: markdown, required: false, hint: "Short intro shown above the cards on this landing page." }
      - name: swim
        label: Swim
        file: content/sports/swim.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: hero_position, label: Hero Image Focal Point, widget: string, required: false, hint: "CSS object-position, e.g. \"center 25%\". Leave blank to centre the image." }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: card_text, label: Card Text, widget: text, required: false, hint: "Short blurb on this sport's card on the homepage and Sports page. Falls back to the SEO Description." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the sport cards on the homepage and the Sports page." }
          - { name: body, label: Body, widget: markdown }

      - name: bike
        label: Bike
        file: content/sports/bike.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: hero_position, label: Hero Image Focal Point, widget: string, required: false, hint: "CSS object-position, e.g. \"center 25%\". Leave blank to centre the image." }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: card_text, label: Card Text, widget: text, required: false, hint: "Short blurb on this sport's card on the homepage and Sports page. Falls back to the SEO Description." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the sport cards on the homepage and the Sports page." }
