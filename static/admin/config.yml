backend:
  name: github
  repo: sftriclub/website
  branch: main
  base_url: https://sveltia-cms-auth.sf-tri-club.workers.dev

# Enables editing against the local filesystem via the Decap proxy server (Sveltia
# speaks the same protocol). Run `mise run cms` and `mise run dev` in two terminals,
# then visit http://localhost:1313/admin/. The proxy is ignored in production builds.
local_backend: true

# Fallback for anything without its own media folder. Each collection below sets a
# `media_folder` so uploads land in the right subfolder of static/images/ instead of
# piling up at the top level. Collection- and field-level paths must be absolute
# (leading slash = repository root); `public_folder` is the matching site URL path.
media_folder: static/images
public_folder: /images

collections:

  # ── Top-level pages ──────────────────────────────────────────────────────
  - name: pages
    label: Pages
    media_folder: /static/images/pages
    public_folder: /images/pages
    files:
      - name: homepage
        label: Homepage
        file: content/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: hero_headline, label: Hero Headline, widget: string }
          - { name: hero_subheadline, label: Hero Subheadline, widget: string }
          - { name: hero_cta_text, label: CTA Button Text, widget: string }
          - { name: hero_cta_url, label: CTA Button URL, widget: string }
          - { name: hero_image, label: Hero Image, widget: image }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }

      - name: trial_workout
        label: Trial Workout
        file: content/trial-workout.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: cta_secondary_text, label: Secondary CTA Text, widget: string, required: false }
          - { name: body, label: Body, widget: markdown }

      - name: membership
        label: Membership
        file: content/membership.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: no_cta, label: Hide the footer call-to-action, widget: boolean, required: false, default: true }
          - { name: body, label: Body, widget: markdown }

      - name: contact
        label: Contact
        file: content/contact.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text, required: false, hint: "Used in Google results and link previews when SEO Description is empty." }
          - { name: meta_description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews instead of the description above. Aim for 120-155 characters." }

  # ── Training Programs ─────────────────────────────────────────────────────
  - name: training
    label: Training Programs
    media_folder: /static/images/training
    public_folder: /images/training
    files:

      - name: training_index
        label: "Training Landing Page"
        file: content/training/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: body, label: Intro Text, widget: markdown, required: false, hint: "Short intro shown above the cards on this landing page." }
      - name: zero_to_sixty
        label: Zero to Sixty
        file: content/training/zero-to-sixty.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Used on the programme cards AND as the page's SEO description. Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: body, label: Body, widget: markdown }

      - name: half_ironman
        label: Half Ironman
        file: content/training/half-ironman.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Used on the programme cards AND as the page's SEO description. Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: body, label: Body, widget: markdown }

      - name: ironman
        label: Ironman
        file: content/training/ironman.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Used on the programme cards AND as the page's SEO description. Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: body, label: Body, widget: markdown }

      - name: training_weekend
        label: Training Weekend
        file: content/training/training-weekend.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Used on the programme cards AND as the page's SEO description. Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: body, label: Body, widget: markdown }

      - name: coaching
        label: Coaching
        file: content/training/coaching.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Used on the programme cards AND as the page's SEO description. Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: body, label: Body, widget: markdown }

  # ── Sports ────────────────────────────────────────────────────────────────
  - name: sports
    label: Sports
    media_folder: /static/images/sports
    public_folder: /images/sports
    files:

      - name: sports_index
        label: "Sports Landing Page"
        file: content/sports/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: body, label: Intro Text, widget: markdown, required: false, hint: "Short intro shown above the cards on this landing page." }
      - name: swim
        label: Swim
        file: content/sports/swim.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: hero_position, label: Hero Image Focal Point, widget: string, required: false, hint: "CSS object-position, e.g. \"center 25%\". Leave blank to centre the image." }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the sport cards on the homepage and the Sports page." }
          - { name: body, label: Body, widget: markdown }

      - name: bike
        label: Bike
        file: content/sports/bike.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: hero_position, label: Hero Image Focal Point, widget: string, required: false, hint: "CSS object-position, e.g. \"center 25%\". Leave blank to centre the image." }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the sport cards on the homepage and the Sports page." }
          - { name: body, label: Body, widget: markdown }

      - name: run
        label: Run
        file: content/sports/run.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: hero_image, label: Hero Image, widget: image, required: false }
          - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
          - { name: hero_position, label: Hero Image Focal Point, widget: string, required: false, hint: "CSS object-position, e.g. \"center 25%\". Leave blank to centre the image." }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: weight, label: Sort Order, widget: number, required: false, value_type: int, hint: "Controls the order of the sport cards on the homepage and the Sports page." }
          - { name: body, label: Body, widget: markdown }

  # ── About ─────────────────────────────────────────────────────────────────
  # Most About pages share /images/about; Social Events and Giving Back keep the
  # folders their existing photos already live in.
  - name: about
    label: About
    media_folder: /static/images/about
    public_folder: /images/about
    files:

      - name: about_index
        label: "About Landing Page"
        file: content/about/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews. Aim for 120-160 characters." }
          - { name: body, label: Intro Text, widget: markdown, required: false, hint: "Short intro shown above the cards on this landing page." }
      - name: mission
        label: Our Mission
        file: content/about/mission.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Short summary shown on this page's card on the About page. Also used in Google results when SEO Description is empty." }
          - { name: meta_description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews instead of the description above. Aim for 120-155 characters." }
          - { name: body, label: Body, widget: markdown }

      - name: code_of_conduct
        label: Code of Conduct
        file: content/about/code-of-conduct.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Short summary shown on this page's card on the About page. Also used in Google results when SEO Description is empty." }
          - { name: meta_description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews instead of the description above. Aim for 120-155 characters." }
          - { name: body, label: Body, widget: markdown }

      - name: social_events
        label: Social Events
        file: content/about/social-events.md
        media_folder: /static/images/social
        public_folder: /images/social
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Short summary shown on this page's card on the About page. Also used in Google results when SEO Description is empty." }
          - { name: meta_description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews instead of the description above. Aim for 120-155 characters." }
          - { name: body, label: Body, widget: markdown }

      - name: giving_back
        label: Giving Back
        file: content/about/giving-back.md
        media_folder: /static/images/giving_back
        public_folder: /images/giving_back
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Short summary shown on this page's card on the About page. Also used in Google results when SEO Description is empty." }
          - { name: meta_description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews instead of the description above. Aim for 120-155 characters." }
          - { name: body, label: Body, widget: markdown }

      - name: club_season
        label: Club Season
        file: content/about/club-season.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Short summary shown on this page's card on the About page. Also used in Google results when SEO Description is empty." }
          - { name: meta_description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews instead of the description above. Aim for 120-155 characters." }
          - { name: body, label: Body, widget: markdown }

      - name: faq
        label: FAQ
        file: content/about/faq.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Card Description, widget: text, required: false, hint: "Short summary shown on this page's card on the About page. Also used in Google results when SEO Description is empty." }
          - { name: meta_description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews instead of the description above. Aim for 120-155 characters." }
          - { name: layout, label: Layout, widget: hidden, default: faq }
          - name: questions
            label: Questions
            widget: list
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }

  # ── News ─────────────────────────────────────────────────────────────────
  - name: news
    label: News
    folder: content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: /static/images/news
    public_folder: /images/news
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime }
      - { name: author, label: Author, widget: string }
      - { name: summary, label: Summary, widget: text, hint: "1-2 sentences shown on the news listing and homepage teaser. Also used in Google results when SEO Description is empty, so keep it under 160 characters." }
      - { name: meta_description, label: SEO Description, widget: text, required: false, hint: "Shown in Google results and link previews instead of the summary. Aim for 120-155 characters." }
      - { name: hero_image, label: Hero Image, widget: image, required: false }
      - { name: hero_image_alt, label: Hero Image Alt Text, widget: string, required: false, hint: "Describes the photo for screen readers and image search. Leave blank if the image is purely decorative." }
      - { name: body, label: Body, widget: markdown }

  # ── Member Spotlight ─────────────────────────────────────────────────────
  # Each member gets their own folder, named after the entry file, e.g.
  # static/images/spotlights/mike-locke/portrait.webp
  - name: member_spotlight
    label: Member Spotlight
    folder: content/member-spotlight
    create: true
    slug: "{{slug}}"
    media_folder: "/static/images/spotlights/{{filename}}"
    public_folder: "/images/spotlights/{{filename}}"
    fields:
      - { name: title, label: Name, widget: string }
      - { name: date, label: Date, widget: datetime }
      - { name: summary, label: Summary, widget: text, hint: "1-2 sentences shown on the spotlight listing. Also used as the page's SEO description, so keep it under 160 characters." }
      - { name: hero_image, label: Hero Photo, widget: image }
      - { name: hero_image_alt, label: "Hero Photo Alt Text (optional)", widget: string, required: false, hint: "For screen readers. Defaults to the member's name." }
      - { name: secondary_image, label: "Secondary Photo (optional)", widget: image, required: false }
      - { name: secondary_image_alt, label: "Secondary Photo Alt Text (optional)", widget: string, required: false, hint: "Defaults to the member's name. Override when the photo shows something other than the member alone." }
      - name: questions
        label: Q&A
        widget: list
        fields:
          - { name: q, label: Question, widget: string }
          - { name: a, label: Answer, widget: text }
      - name: race_groups
        label: Race Resume
        widget: list
        fields:
          - { name: title, label: Category, widget: string, hint: "e.g. Ironman, Long Course 70.3, Olympic, Sprint" }
          - name: races
            label: Races
            widget: list
            field: { name: race, label: Race, widget: string }
      - { name: body, label: "Body (optional intro/notes)", widget: markdown, required: false }

  # ── Sponsors ──────────────────────────────────────────────────────────────
  - name: sponsors
    label: Sponsors
    media_folder: /static/images/sponsors
    public_folder: /images/sponsors
    files:
      - name: sponsors
        label: Sponsor List
        file: data/sponsors.yaml
        fields:
          - name: sponsors
            label: Sponsors
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: logo, label: Logo, widget: image }
              - { name: url, label: Website URL, widget: string }
              - { name: description, label: Description, widget: string, required: false }

  # ── Board Members ─────────────────────────────────────────────────────────
  - name: board
    label: Board Members
    media_folder: /static/images/board
    public_folder: /images/board
    files:
      - name: board
        label: Board Member List
        file: data/board.yaml
        fields:
          - name: members
            label: Members
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role/Title, widget: string }
              - { name: photo, label: Photo, widget: image, required: false }
              - { name: bio, label: Bio, widget: text, required: false }
