baseURL = "https://sftriclub.org/"
languageCode = "en-us"
title = "San Francisco Triathlon Club"

# Generate robots.txt from layouts/robots.txt (points crawlers at the sitemap).
enableRobotsTXT = true

# No content uses tags or categories, so the empty /tags/ and /categories/
# pages were thin content sitting in the sitemap.
disableKinds = ["taxonomy", "term"]

# The CMS uploads to static/images, but Hugo's image pipeline can only read
# from assets/. Mounting the same directory into assets/images lets templates
# read intrinsic dimensions and build srcsets from those files while they
# continue to be served verbatim at /images/...  Declaring any mount replaces
# Hugo's defaults, so the standard ones are repeated below.
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "data"
  target = "data"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "i18n"
  target = "i18n"
[[module.mounts]]
  source = "archetypes"
  target = "archetypes"
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "static/images"
  target = "assets/images"

[params]
  description = "A multi-sport club and 501(c)(3) nonprofit in San Francisco."
  # Appended to the site title on the homepage <title> tag.
  tagline = "Swim, Bike, Run"
  # Fallback social share image for pages without a hero image.
  ogImage = "/sf-tri-logo-cream.png"
  email = "info@sftriclub.org"
  instagram = "https://www.instagram.com/sftriclub"
  facebook = "https://www.facebook.com/sftriclub"
  tiktok = "https://www.tiktok.com/@sftriclub"
  strava = "https://www.strava.com/clubs/sftriclub"
  login = "https://www.heylo.com/login"
  # Heylo invite link: the Join button on /membership/ (unless the page sets join_url).
  heyloSignup = "https://www.heylo.com/invite/30b897c1-3bba-4511-9a25-c2bde97b9491"

